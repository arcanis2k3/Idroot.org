      #feedback-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;

      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
      }
      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--ink);
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--white);
        color: var(--ink);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--sky-mid);
        box-shadow: 0 0 0 4px var(--sky-light);
      }
      #form-status {
        margin-top: 1.5rem;
        display: none;
      }

    <div class="legal-container">
      <div class="doc-label">サポート</div>
      <div class="doc-h1">フィードバック</div>
      <p class="doc-p">
        皆様からのフィードバックをお待ちしております。ご意見、ご提案、または発生した問題については、以下のフォームからお知らせください。
      </p>

      <form id="feedback-form" onsubmit="handleFeedbackSubmit(event)">
        <div class="form-group">
          <label for="name">お名前（任意）</label>
          <input type="text" id="name" name="name" placeholder="お名前" />
        </div>

        <div class="form-group">
          <label for="email">メールアドレス（任意）</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
          />
        </div>

        <div class="form-group">
          <label for="category">カテゴリー</label>
          <select id="category" name="category">
            <option value="一般的なフィードバック">一般的なフィードバック</option>
            <option value="バグ報告">バグ報告</option>
            <option value="機能リクエスト">機能リクエスト</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">メッセージ</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            required
            placeholder="ご意見をお聞かせください..."
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn-primary"
          data-loading-text="送信中..."
          data-success-text="ありがとうございます！フィードバックを受け付けました。"
          data-error-text="エラーが発生しました。後でもう一度お試しください。"
        >
          フィードバックを送信
        </button>
      </form>

      <div id="form-status"></div>
    </div>
