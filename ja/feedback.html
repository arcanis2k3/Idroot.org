    #form-status { margin-top: 1.5rem; display: none; }

      <a href="https://dashboard.idroot.org" class="btn-primary"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg> Dashboard</a>
    </div>
  </nav>
  <div class="legal-container">
    <div class="doc-label">サポート</div>
    <div class="doc-h1">フィードバック</div>
    <p class="doc-p">皆様のご意見をお待ちしております。ご意見、ご提案、または発生した問題については、以下のフォームをご利用ください。</p>
    <form id="feedback-form" onsubmit="handleFeedbackSubmit(event)">
      <div class="form-group"><label for="name">お名前（任意）</label><input type="text" id="name" name="name" /></div>
      <div class="form-group"><label for="email">メールアドレス（任意）</label><input type="email" id="email" name="email" /></div>
      <div class="form-group"><label for="category">カテゴリー</label><select id="category" name="category"><option value="全般的なフィードバック">全般的なフィードバック</option><option value="バグ報告">バグ報告</option><option value="機能要望">機能要望</option><option value="その他">その他</option></select></div>
      <div class="form-group"><label for="message">メッセージ</label><textarea id="message" name="message" rows="6" required></textarea></div>
      <button type="submit" class="btn-primary" data-loading-text="送信中..." data-success-text="ありがとうございます！フィードバックを受け付けました。" data-error-text="問題が発生しました。後でもう一度お試しください。">フィードバックを送信</button>
    </form>
    <div id="form-status"></div>
  </div>
