<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const supported = ["en", "de", "es", "pt", "ja"];
        const lang = (navigator.language || navigator.userLanguage || "en")
          .slice(0, 2)
          .toLowerCase();
        const target = supported.indexOf(lang) !== -1 ? lang : "en";

        window.location.replace("/" + target + "/confirmed.html?" + urlParams.toString());
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="font-family: sans-serif; text-align: center; padding: 4rem 2rem; color: #0f1923;">
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">JavaScript Required</h1>
        <p style="color: #3d5166; max-width: 400px; margin: 0 auto; line-height: 1.6;">
          JavaScript is required to detect your language and securely complete your account setup. Please enable JavaScript in your browser settings and try again.
        </p>
      </div>
    </noscript>
    <p style="text-align: center; padding-top: 2rem; font-family: sans-serif; color: #7a9ab0;">Redirecting to confirmation page...</p>
  </body>
</html>
